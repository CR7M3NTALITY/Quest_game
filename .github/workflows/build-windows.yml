name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Позволяет запускать сборку вручную

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame pyinstaller
        
    - name: Build with PyInstaller
      run: |
        pyinstaller --noconsole --name "DungeonOfBugs" game.py
        
    - name: Copy assets to dist
      run: |
        Copy-Item -Path "assets" -Destination "dist/DungeonOfBugs/assets" -Recurse
        
    - name: Upload Windows Executable
      uses: actions/upload-artifact@v3
      with:
        name: DungeonOfBugs-Windows
        path: dist/DungeonOfBugs/