name: Build and Release (Windows & macOS)

on:
  push:
    tags:
      - 'v*'  # Запускается при создании тега (например, v1.3)
  workflow_dispatch:  # Можно запустить вручную

jobs:
  # === СБОРКА ДЛЯ WINDOWS ===
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame pyinstaller
        
    - name: Build with PyInstaller
      run: |
        pyinstaller --noconsole --name "DungeonOfBugs" game.py
        
    - name: Copy assets to dist
      run: |
        Copy-Item -Path "assets" -Destination "dist/DungeonOfBugs/assets" -Recurse
        
    - name: Zip the build folder
      run: |
        Compress-Archive -Path dist\DungeonOfBugs\* -DestinationPath DungeonOfBugs-Windows.zip
        
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DungeonOfBugs-Windows
        path: DungeonOfBugs-Windows.zip

  # === СБОРКА ДЛЯ macOS ===
  build-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame pyinstaller
        
    - name: Build with PyInstaller
      run: |
        # Флаг --windowed на macOS создает стандартный .app бандл
        pyinstaller --windowed --name "DungeonOfBugs" game.py
        
    - name: Copy assets to macOS app bundle
      run: |
        # На macOS исполняемый файл лежит внутри .app/Contents/MacOS/
        # Поэтому копируем assets именно туда, чтобы наш Python-код их нашел
        mkdir -p dist/DungeonOfBugs.app/Contents/MacOS/assets
        cp -r assets/* dist/DungeonOfBugs.app/Contents/MacOS/assets/
        
    - name: Zip the macOS app
      run: |
        # Используем ditto для корректного архивирования .app бандла на Mac
        ditto -c -k --sequesterRsrc --keepParent dist/DungeonOfBugs.app DungeonOfBugs-macOS.zip
        
    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DungeonOfBugs-macOS
        path: DungeonOfBugs-macOS.zip

  # === СОЗДАНИЕ РЕЛИЗА ===
  create-release:
    needs: [build-windows, build-macos] # Ждет завершения обеих сборок
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: DungeonOfBugs-Windows
        
    - name: Download macOS Artifact
      uses: actions/download-artifact@v4
      with:
        name: DungeonOfBugs-macOS
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          DungeonOfBugs-Windows.zip
          DungeonOfBugs-macOS.zip
        name: Release ${{ github.ref_name }}
        body: "Автоматическая кроссплатформенная сборка игры для тестирования методом черного ящика (Windows и macOS)."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}